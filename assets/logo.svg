<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shieldFillLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef2f6"/>
    </linearGradient>
    <linearGradient id="accentGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#17a06a"/>
      <stop offset="100%" stop-color="#0e6b48"/>
    </linearGradient>
  </defs>

  <!-- Hexagon shield outline -->
  <path d="M120 16 L204 60 L204 148 C204 190 120 224 120 224 C120 224 36 190 36 148 L36 60 Z"
        fill="url(#shieldFillLight)" stroke="url(#accentGradLight)" stroke-width="3"/>

  <!-- inner circuit ring -->
  <path d="M120 34 L188 70 L188 146 C188 180 120 206 120 206 C120 206 52 180 52 146 L52 70 Z"
        fill="none" stroke="#17a06a" stroke-width="1" opacity="0.35"/>

  <!-- Circuit traces -->
  <g stroke="#17a06a" stroke-width="2" fill="none" opacity="0.55" stroke-linecap="round">
    <path d="M36 92 L58 92 L58 78"/>
    <path d="M204 92 L182 92 L182 78"/>
    <path d="M36 168 L58 168 L58 182"/>
    <path d="M204 168 L182 168 L182 182"/>
    <circle cx="58" cy="78" r="3" fill="#17a06a" stroke="none"/>
    <circle cx="182" cy="78" r="3" fill="#17a06a" stroke="none"/>
    <circle cx="58" cy="182" r="3" fill="#17a06a" stroke="none"/>
    <circle cx="182" cy="182" r="3" fill="#17a06a" stroke="none"/>
  </g>

  <!-- Lock, centered -->
  <g transform="translate(120, 128)">
    <path d="M -20 -8 Q -20 -34 0 -34 Q 20 -34 20 -8" fill="none" stroke="url(#accentGradLight)" stroke-width="6" stroke-linecap="round"/>
    <rect x="-26" y="-8" width="52" height="42" rx="8" fill="url(#accentGradLight)"/>
    <circle cx="0" cy="8" r="5" fill="#ffffff"/>
    <rect x="-3" y="11" width="6" height="12" rx="2" fill="#ffffff"/>
  </g>

  <!-- Signal / scan bars, bottom -->
  <g fill="#17a06a">
    <rect x="102" y="198" width="6" height="10" rx="1" opacity="0.9"/>
    <rect x="114" y="192" width="6" height="16" rx="1" opacity="0.75"/>
    <rect x="126" y="196" width="6" height="12" rx="1" opacity="0.9"/>
  </g>
</svg>
